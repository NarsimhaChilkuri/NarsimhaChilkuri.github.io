<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narsimha Chilkuri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #fbfcfd; --fg: #1a2230; --muted: #5d6878; --rule: #dfe4ea; --accent: #1f5fa8;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12161c; --fg: #e3e8ee; --muted: #9aa5b3; --rule: #2a323d; --accent: #7fb4ee; color-scheme: dark; }
}
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
  font-size: 1.0625rem; line-height: 1.65; padding: 3rem 16px 5rem; }
main { max-width: 42rem; margin: 0 auto; }
h1 { font-size: 1.9rem; line-height: 1.2; font-weight: 600; margin: 0 0 2.5rem; }
h2 { font-family: var(--mono); font-size: 0.8rem; font-weight: 500; color: var(--accent);
  letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 0.5rem; }
ul { list-style: none; margin: 0; padding: 0; }
li { border-top: 1px solid var(--rule); padding: 1.1rem 0; }
li a { color: var(--fg); font-size: 1.2rem; font-weight: 600; text-decoration: none; }
li a:hover, li a:focus-visible { color: var(--accent); text-decoration: underline; }
li p { margin: 0.2rem 0 0; color: var(--muted); }
li time { display: block; margin-top: 0.3rem; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Narsimha Chilkuri</h1>
<h2>Writing</h2>
<ul>
  <li>
    <a href="outer-product-memory/">Memory as a Sum of Outer Products</a>
    <p>One view of linear attention, the LMU, and state space models.</p>
    <time datetime="2026-11-12">12 November 2026</time>
  </li>
</ul>
</main>
</body>
</html>
